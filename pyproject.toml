[project]
name = "voltsocial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "matheuslacerda-dev", email = "matheuslacerda01@proton.me" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "httpx2>=2.13.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
voltsocial = "voltsocial:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
